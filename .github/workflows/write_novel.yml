name: Generate 80k Word Novel
on:
  workflow_dispatch:

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install huggingface_hub

      - name: Run Novel Writer Script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          import time
          from huggingface_hub import InferenceClient

          client = InferenceClient(
                   model='meta-llama/Meta-Llama-3.1-70B-Instruct',
                          
              
              token=os.environ['HF_TOKEN']
          )

          with open('outline.txt', 'r') as f:
              outline = f.read()

          completed = []
          if os.path.exists('progress.txt'):
              with open('progress.txt', 'r') as f:
                  completed = f.read().splitlines()

          for i in range(1, 35):
              chapter_file = f'chapter_{i}.txt'
              if str(i) in completed or os.path.exists(chapter_file):
                  print(f'Chapter {i} already exists. Skipping.')
                  continue

              print(f'Generating Chapter {i}...')
              
              prev_context = ''
              if i > 1 and os.path.exists(f'chapter_{i-1}.txt'):
                  with open(f'chapter_{i-1}.txt', 'r') as f:
                      prev_context = f.read()[-3000:]

              prompt = f'You are an expert novelist writing a Christian YA Romantic Comedy titled \"Text Me, Lord\". Based on this full outline:\n{outline}\n\nFollowing these events from the previous chapter:\n{prev_context}\n\nWrite Chapter {i} of the novel. It must be a highly detailed, immersive narrative chapter, aiming for approximately 2,400 words. Maintain a warm, funny, heartfelt, and faith-filled tone with a witty teenage voice. Write out all dialogue, actions, family/school elements, and emotional progression. Do not summarize.'
              
              for attempt in range(3):
                  try:
                      messages = [{'role': 'user', 'content': prompt}]
                      response = client.chat_completion(
                          messages=messages,
                          max_tokens=4000,
                          temperature=0.7
                      )
                      
                      output_text = response.choices.message.content
                      
                      with open(chapter_file, 'w') as f:
                          f.write(output_text)
                          
                      with open('progress.txt', 'a') as f:
                          f.write(f'{i}\n')
                          
                      print(f'Successfully wrote Chapter {i}.')
                      time.sleep(8)
                      break
                  except Exception as e:
                      print(f'Error on Chapter {i} (Attempt {attempt+1}): {e}')
                      time.sleep(20)
          "

      - name: Commit and Push Book Files
        run: |
          git config --global user.name 'Novel-Bot'
          git config --global user.email 'novel-bot@github.com'
          git add chapter_*.txt progress.txt || true
          git commit -m "AI added newly generated 2400-word chapters via Hugging Face" || true
          git push
          
