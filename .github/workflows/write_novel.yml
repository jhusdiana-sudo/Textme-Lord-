name: Generate 80k Word Novel
on:
  workflow_dispatch:

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install huggingface_hub

      - name: Run Novel Writer Script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python write_novel.py

      - name: Commit and Push Book Files
        run: |
          git config --global user.name 'Novel-Bot'
          git config --global user.email 'novel-bot@github.com'
          git add chapter_*.txt progress.txt || true
          git commit -m "AI added newly generated 2400-word chapters via Hugging Face" || true
          git push
          
